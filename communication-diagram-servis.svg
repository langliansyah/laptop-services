<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" role="img" aria-labelledby="title description">
  <title id="title">Communication Diagram Alur Kerja Teknisi</title>
  <desc id="description">Diagram komunikasi UML berfokus pada teknisi dan objek aplikasi yang berkolaborasi untuk memeriksa daftar servis, menyimpan diagnosis, memperbarui progres, dan menandai unit siap diambil.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526174; }
      .actor { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
      .object { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .data { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .node-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .node-type { font-size: 12px; fill: #526174; text-anchor: middle; }
      .link { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .linklabel { font-size: 12px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .panelhead { fill: #eff6ff; stroke: #bfdbfe; }
      .headtext { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 12.5px; }
      .num { font-weight: 700; fill: #1d4ed8; }
      .phase { font-size: 15px; font-weight: 700; fill: #334155; }
      .note { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.2; }
      .notetext { font-size: 13px; fill: #9a3412; }
      .footer { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect width="1360" height="1060" fill="#ffffff"/>
  <text x="680" y="43" class="title" text-anchor="middle">Communication Diagram — Alur Kerja Teknisi</text>
  <text x="680" y="71" class="subtitle" text-anchor="middle">Satu aktor utama dan objek-objek yang berkomunikasi untuk menangani servis.</text>

  <rect x="55" y="94" width="1250" height="58" rx="9" class="note"/>
  <text x="75" y="119" class="notetext">Prasyarat: teknisi sudah login. Diagnosis dilakukan saat status diagnosing; progres dan “siap diambil” hanya bisa dilakukan</text>
  <text x="75" y="140" class="notetext">setelah pelanggan menyetujui estimasi dan status menjadi in_progress.</text>

  <!-- Objects and the communication links between them -->
  <g>
    <rect x="55" y="180" width="190" height="82" rx="12" class="actor"/>
    <text x="150" y="214" class="node-title">Teknisi</text>
    <text x="150" y="238" class="node-type">«aktor»</text>

    <rect x="330" y="180" width="190" height="82" rx="12" class="object"/>
    <text x="425" y="214" class="node-title">Halaman Staff</text>
    <text x="425" y="238" class="node-type">«boundary»</text>

    <rect x="605" y="180" width="190" height="82" rx="12" class="object"/>
    <text x="700" y="214" class="node-title">StaffService</text>
    <text x="700" y="234" class="node-title">Controller</text>
    <text x="700" y="252" class="node-type">«controller»</text>

    <rect x="880" y="180" width="190" height="82" rx="12" class="object"/>
    <text x="975" y="214" class="node-title">Service Model</text>
    <text x="975" y="238" class="node-type">«entity»</text>

    <rect x="1155" y="180" width="150" height="82" rx="12" class="data"/>
    <text x="1230" y="214" class="node-title">Database</text>
    <text x="1230" y="238" class="node-type">services</text>
  </g>
  <line x1="245" y1="221" x2="330" y2="221" class="link"/>
  <line x1="520" y1="221" x2="605" y2="221" class="link"/>
  <line x1="795" y1="221" x2="880" y2="221" class="link"/>
  <line x1="1070" y1="221" x2="1155" y2="221" class="link"/>
  <text x="287" y="207" class="linklabel">A</text>
  <text x="562" y="207" class="linklabel">B</text>
  <text x="837" y="207" class="linklabel">C</text>
  <text x="1112" y="207" class="linklabel">D</text>

  <text x="55" y="300" class="phase">Rangkaian pesan pada setiap hubungan</text>
  <text x="55" y="322" class="footer">Baca nomor per proses dari kiri ke kanan; label A–D pada panah menghubungkan pesan ke objek yang berkomunikasi.</text>

  <!-- A: Technician to staff page -->
  <rect x="55" y="343" width="295" height="466" rx="9" class="panel"/>
  <rect x="55" y="343" width="295" height="45" rx="9" class="panelhead"/>
  <text x="202" y="372" class="headtext">A · Teknisi → Halaman Staff</text>
  <text x="72" y="418" class="body"><tspan class="num">1.</tspan> Membuka menu servis</text>
  <line x1="72" y1="432" x2="331" y2="432" stroke="#e2e8f0"/>
  <text x="72" y="462" class="body"><tspan class="num">2.</tspan> Mengisi diagnosis, biaya,</text>
  <text x="94" y="482" class="body">estimasi hari kerja, dan foto</text>
  <text x="94" y="502" class="body">diagnosis (opsional)</text>
  <line x1="72" y1="516" x2="331" y2="516" stroke="#e2e8f0"/>
  <text x="72" y="548" class="body"><tspan class="num">3.</tspan> Memilih catatan progres:</text>
  <text x="94" y="570" class="body">perbaikan berjalan, menunggu</text>
  <text x="94" y="590" class="body">sparepart, atau QC</text>
  <line x1="72" y1="604" x2="331" y2="604" stroke="#e2e8f0"/>
  <text x="72" y="636" class="body"><tspan class="num">4.</tspan> Menekan tombol “Siap</text>
  <text x="94" y="658" class="body">diambil” setelah perbaikan/QC</text>
  <text x="72" y="783" class="footer">Permintaan dari aktor teknisi</text>

  <!-- B: Staff page to controller -->
  <rect x="365" y="343" width="295" height="466" rx="9" class="panel"/>
  <rect x="365" y="343" width="295" height="45" rx="9" class="panelhead"/>
  <text x="512" y="372" class="headtext">B · Halaman Staff → Controller</text>
  <text x="382" y="418" class="body"><tspan class="num">1.1</tspan> GET /staff</text>
  <line x1="382" y1="432" x2="641" y2="432" stroke="#e2e8f0"/>
  <text x="382" y="462" class="body"><tspan class="num">2.1</tspan> POST /staff/{service}/diagnosis</text>
  <line x1="382" y1="480" x2="641" y2="480" stroke="#e2e8f0"/>
  <text x="382" y="512" class="body"><tspan class="num">3.1</tspan> POST /staff/{service}/progres</text>
  <line x1="382" y1="530" x2="641" y2="530" stroke="#e2e8f0"/>
  <text x="382" y="562" class="body"><tspan class="num">4.1</tspan> POST /staff/{service}/</text>
  <text x="415" y="582" class="body">siap-diambil</text>
  <text x="382" y="783" class="footer">Router memeriksa login dan role teknisi.</text>

  <!-- C: Controller to Service model -->
  <rect x="675" y="343" width="295" height="466" rx="9" class="panel"/>
  <rect x="675" y="343" width="295" height="45" rx="9" class="panelhead"/>
  <text x="822" y="372" class="headtext">C · Controller → Service Model</text>
  <text x="692" y="418" class="body"><tspan class="num">1.2</tspan> Meminta daftar servis</text>
  <line x1="692" y1="432" x2="951" y2="432" stroke="#e2e8f0"/>
  <text x="692" y="462" class="body"><tspan class="num">2.2</tspan> Validasi status diagnosing;</text>
  <text x="724" y="482" class="body">simpan hasil diagnosis dan ubah</text>
  <text x="724" y="502" class="body">status ke waiting_approval</text>
  <line x1="692" y1="516" x2="951" y2="516" stroke="#e2e8f0"/>
  <text x="692" y="548" class="body"><tspan class="num">3.2</tspan> Validasi status in_progress;</text>
  <text x="724" y="568" class="body">simpan progress_note</text>
  <line x1="692" y1="584" x2="951" y2="584" stroke="#e2e8f0"/>
  <text x="692" y="616" class="body"><tspan class="num">4.2</tspan> Pastikan transisi diizinkan;</text>
  <text x="724" y="636" class="body">set status ready_for_pickup</text>
  <text x="692" y="783" class="footer">Controller memvalidasi aksi dan status.</text>

  <!-- D: Model to database -->
  <rect x="985" y="343" width="320" height="466" rx="9" class="panel"/>
  <rect x="985" y="343" width="320" height="45" rx="9" class="panelhead"/>
  <text x="1145" y="372" class="headtext">D · Service Model → Database</text>
  <text x="1002" y="418" class="body"><tspan class="num">1.3</tspan> Membaca daftar servis</text>
  <line x1="1002" y1="432" x2="1288" y2="432" stroke="#e2e8f0"/>
  <text x="1002" y="462" class="body"><tspan class="num">2.3</tspan> Menyimpan diagnosis, biaya,</text>
  <text x="1034" y="482" class="body">estimasi, foto (jika ada), dan</text>
  <text x="1034" y="502" class="body">status waiting_approval</text>
  <line x1="1002" y1="516" x2="1288" y2="516" stroke="#e2e8f0"/>
  <text x="1002" y="548" class="body"><tspan class="num">3.3</tspan> Menyimpan progress_note</text>
  <line x1="1002" y1="564" x2="1288" y2="564" stroke="#e2e8f0"/>
  <text x="1002" y="596" class="body"><tspan class="num">4.3</tspan> Menyimpan status</text>
  <text x="1034" y="616" class="body">ready_for_pickup</text>
  <text x="1002" y="783" class="footer">Data servis tersimpan.</text>

  <rect x="55" y="833" width="1250" height="98" rx="9" class="note"/>
  <text x="75" y="861" class="notetext">Alur singkat: buka daftar → simpan diagnosis → tunggu persetujuan pelanggan → perbarui progres → tandai siap diambil.</text>
  <text x="75" y="884" class="notetext">Diagram ini hanya menggambarkan pekerjaan teknisi. Persetujuan pelanggan dan konfirmasi pembayaran oleh admin berada</text>
  <text x="75" y="907" class="notetext">di luar cakupan diagram; pembayaran dilakukan setelah status servis ready_for_pickup.</text>

  <text x="680" y="974" class="footer" text-anchor="middle">Sesuai endpoint dan aturan status pada StaffServiceController dan ServiceStatus di aplikasi.</text>
</svg>
